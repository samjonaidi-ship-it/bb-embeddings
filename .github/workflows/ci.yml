# bb-embeddings | .github/workflows/ci.yml | v1.0.0 | 2026-11-17 | BB
# Builds the real Dockerfile and proves the service: golden vectors, then HTTP checks.
# This repo had no CI before this file. The job name "test" is what a branch
# protection rule would require.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Comparison logic self-test
        run: python3 tests/golden_test.py --self-test

      - name: Build the image
        run: docker build -t bb-embeddings:ci .

      - name: Golden vectors
        run: |
          mkdir -p tests/out
          docker run --rm -v "$PWD/tests:/app/tests" bb-embeddings:ci python3 tests/golden_test.py

      - name: Upload the vectors this build produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vectors
          path: tests/out/vectors.json
          if-no-files-found: warn

      - name: Start the service
        run: docker run -d --name svc -p 8080:8080 -e EMBED_SERVICE_TOKEN=ci-test-token bb-embeddings:ci

      - name: HTTP checks
        run: python3 tests/http_test.py http://127.0.0.1:8080 ci-test-token

      - name: Service logs
        if: always()
        run: docker logs svc || true
